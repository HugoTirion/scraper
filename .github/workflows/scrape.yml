name: scrape-ov-fiets

on:
  schedule:
    # Elke 5 min, maar op minuut 3, 8, 13, ... om de piekdrukte op het hele uur te ontwijken
    - cron: "3-58/5 * * * *"
  workflow_dispatch: {}        # handmatig starten via de Actions-tab

permissions:
  contents: write              # nodig om data terug te committen

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Scrape
        run: python3 scrape.py

      - name: Commit & push
        run: |
          git config user.name  "ovfiets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
